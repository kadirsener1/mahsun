name: Update M3U Playlist

on:
  # Her 31 dakikada bir çalış
  schedule:
    - cron: '*/31 * * * *'
  
  # Manuel tetikleme
  workflow_dispatch:
  
  # Push ile tetikleme (ilk kurulum için)
  push:
    branches:
      - main
    paths:
      - 'scraper.py'
      - '.github/workflows/update-playlist.yml'

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run scraper
        run: |
          python scraper.py
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 30
      
      - name: Check for changes
        id: check_changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Değişiklik yok."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Değişiklikler tespit edildi."
          fi
      
      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          git commit -m "🔄 Playlist güncellendi - ${TIMESTAMP}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload playlist as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist
          path: |
            playlist.m3u
            state.json
          retention-days: 7
