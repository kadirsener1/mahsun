name: Mahsunsports M3U8 Scraper

on:
  schedule:
    - cron: '0 */6 * * *'   # Her 6 saatte bir çalışır
  workflow_dispatch:          # Manuel tetikleme

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Repo'yu çek ──────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── 2. Python kur ───────────────────────────────
      - name: 🐍 Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Chrome kur ───────────────────────────────
      - name: 🌐 Chrome Kur
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ── 4. ChromeDriver kur ─────────────────────────
      - name: 🔧 ChromeDriver Kur
        uses: nanasess/setup-chromedriver@v1

      # ── 5. Python kütüphaneleri ──────────────────────
      - name: 📦 Kütüphaneleri Kur
        run: |
          pip install --upgrade pip
          pip install requests selenium seleniumwire

      # ── 6. Scraper'ı çalıştır ───────────────────────
      - name: 🚀 Scraper Çalıştır
        env:
          CHROMEDRIVER_PATH: /usr/local/bin/chromedriver
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python scraper.py

      # ── 7. Sonuçları kontrol et ─────────────────────
      - name: 📋 Sonuçları Göster
        run: |
          echo "=== playlist.m3u ==="
          cat playlist.m3u || echo "playlist.m3u bulunamadı"
          echo ""
          echo "=== stats.json ==="
          cat stats.json || echo "stats.json bulunamadı"

      # ── 8. Değişiklikleri commit et ──────────────────
      - name: 💾 Commit & Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.m3u stats.json logs/ || true
          git diff --staged --quiet || git commit -m "🔄 Playlist güncellendi: $(date '+%Y-%m-%d %H:%M:%S')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
