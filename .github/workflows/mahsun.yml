name: Mahsun Update List

on:
  schedule:
    - cron: '0 0 * * *' # Her gece 00:00'da çalışır (UTC)
  workflow_dispatch:     # Manuel tetikleme butonu

permissions:
  contents: write        # Depoya commit ve push yapabilmek için gerekli izin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u
          git diff --staged --quiet || (git commit -m "Playlist güncellendi [skip ci]" && git push)
