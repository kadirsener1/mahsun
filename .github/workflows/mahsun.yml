name: Mahsun Update List son

on:
  schedule:
    - cron: '0 0 * * *' # Her gece 00:00'da (UTC) otomatik çalışır
  workflow_dispatch:     # GitHub panelinden manuel çalıştırma butonu

permissions:
  contents: write        # Değişiklikleri repoya push yapabilmek için gerekli izin

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests selenium selenium-wire webdriver-manager

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u stats.json
          git diff --staged --quiet || (git commit -m "Playlist güncellendi [skip ci]" && git push)
