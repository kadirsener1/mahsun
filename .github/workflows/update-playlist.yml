name: Mahsunsports M3U8 Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'          # ← 3.10 daha stabil

      - name: 🌐 Chrome Kur
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 📦 Kütüphaneleri Kur
        run: |
          pip install --upgrade pip
          pip install requests selenium selenium-wire webdriver-manager

      - name: 🚀 Scraper Çalıştır
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python scraper.py

      - name: 📋 Sonuçları Göster
        run: |
          echo "=== playlist.m3u ==="
          cat playlist.m3u || echo "Bulunamadı"
          echo ""
          echo "=== stats.json ==="
          cat stats.json || echo "Bulunamadı"

      - name: 💾 Commit & Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.m3u stats.json logs/ || true
          git diff --staged --quiet || git commit -m "🔄 Playlist güncellendi: $(date '+%Y-%m-%d %H:%M:%S')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
