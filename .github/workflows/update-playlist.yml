name: Update M3U Playlist

on:
  schedule:
    # Her 31 dakikada bir (GitHub cron en az 5dk destekler)
    - cron: '*/31 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper.py'
      - '.github/workflows/update-playlist.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Setup Chrome & ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        run: |
          # Chrome versiyonunu al
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          echo "Chrome: $CHROME_VERSION"

          # chromedriver-autoinstaller ile otomatik eşleştir
          pip install chromedriver-autoinstaller
          python -c "import chromedriver_autoinstaller; chromedriver_autoinstaller.install()"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit & Push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            CHANNEL_COUNT=$(grep -c "^#EXTINF" playlist.m3u 2>/dev/null || echo "0")
            git commit -m "🔄 Playlist güncellendi - ${CHANNEL_COUNT} kanal - ${TIMESTAMP}"
            git push
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-files
          path: |
            playlist.m3u
            state.json
            channels_backup.json
          retention-days: 5
